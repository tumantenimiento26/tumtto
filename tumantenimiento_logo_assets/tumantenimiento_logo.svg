<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Tumantenimiento logo</title>
  <desc id="desc">Minimal mobile app logo with a house, wrench, screwdriver, and the Tumantenimiento wordmark.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="330" y1="295" x2="690" y2="545" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20D7FF"/>
      <stop offset="0.55" stop-color="#0B84F3"/>
      <stop offset="1" stop-color="#0B3DAD"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="170" y1="0" x2="855" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1172E6"/>
      <stop offset="1" stop-color="#12315F"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.03  0 0 0 0 0.47  0 0 0 0 1  0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
    <clipPath id="houseClip">
      <path d="M512 291c-7 0-14 2-20 6L356 380c-11 7-18 19-18 32v6c0 8 6 14 14 14h30v92c0 22 18 40 40 40h180c22 0 40-18 40-40v-92h30c8 0 14-6 14-14v-6c0-13-7-25-18-32L532 297c-6-4-13-6-20-6z"/>
    </clipPath>
  </defs>

  <g filter="url(#softGlow)">
    <path d="M512 291c-7 0-14 2-20 6L356 380c-11 7-18 19-18 32v6c0 8 6 14 14 14h30v92c0 22 18 40 40 40h180c22 0 40-18 40-40v-92h30c8 0 14-6 14-14v-6c0-13-7-25-18-32L532 297c-6-4-13-6-20-6z" fill="url(#brandGradient)"/>
  </g>

  <g clip-path="url(#houseClip)">
    <path d="M419 380c-29 30-33 77-8 112l-59 111c-6 12-2 27 10 33l25 13c12 6 27 2 33-10l60-111c41 3 81-19 100-57 13-26 13-56 0-82l-39 75-56-30 40-75c-40-3-78 15-106 21z" fill="#F7FBFF" opacity="0.92"/>
    <path d="M571 356h42l16 37-20 128h-34l-20-128 16-37z" fill="#103A83" opacity="0.34"/>
    <rect x="533" y="514" width="95" height="18" rx="9" fill="#F7FBFF" opacity="0.30"/>
    <rect x="537" y="545" width="58" height="18" rx="9" fill="#F7FBFF" opacity="0.18"/>
  </g>

  <text x="512" y="677" text-anchor="middle"
        font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="90" font-weight="700" letter-spacing="-3"
        fill="url(#textGradient)">Tumantenimiento</text>
</svg>
